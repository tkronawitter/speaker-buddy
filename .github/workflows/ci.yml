name: ci

on:
  push:
    branches: [main]
    paths:
      - "laptop/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "laptop/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  laptop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token is not left in the checkout
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore laptop/SpeakerBuddy.sln

      - name: Build
        run: dotnet build laptop/SpeakerBuddy.sln --no-restore -warnaserror

      - name: Format
        run: dotnet format laptop/SpeakerBuddy.sln --no-restore --verify-no-changes

      # Core only: the App tests need the Windows desktop runtime and run in the laptop-app job
      - name: Test
        run: >
          dotnet test laptop/tests/SpeakerBuddy.Core.Tests/SpeakerBuddy.Core.Tests.csproj --no-build
          --collect:"XPlat Code Coverage"
          --results-directory laptop/TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-laptop
          path: laptop/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Composite action (its only JavaScript step runs on node24). The CODECOV_TOKEN secret is set,
      # so a failed upload fails CI instead of leaving a silent gap in the coverage history
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: laptop/TestResults
          flags: laptop
          fail_ci_if_error: true

  # TalkRunner, SerialLink, TrayContext and the COM release with a fake port and a fake PowerPoint
  # source; WinForms, the registry and COM need Windows. Coverage joins the laptop flag
  laptop-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token is not left in the checkout
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: >
          dotnet test laptop/tests/SpeakerBuddy.App.Tests/SpeakerBuddy.App.Tests.csproj
          --collect:"XPlat Code Coverage"
          --results-directory laptop/TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: laptop/TestResults
          flags: laptop
          fail_ci_if_error: true

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token is not left in the checkout
          persist-credentials: false

      - name: Configure
        run: cmake -S firmware/test/host -B build-host -DTIMER_CORE_COVERAGE=ON

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

      # gcovr turns the gcov data of timer_core (not of the tests) into Cobertura with repo-relative paths
      - name: Coverage report
        run: |
          pipx install gcovr==8.3
          gcovr --root . --filter firmware/components/timer_core/ --object-directory build-host \
            --cobertura build-host/coverage.cobertura.xml --print-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-host/coverage.cobertura.xml
          disable_search: true
          flags: firmware
          fail_ci_if_error: true

  firmware-build:
    runs-on: ubuntu-latest
    container:
      # ESP-IDF v5.5.5 as pinned in firmware/main/idf_component.yml; the digest fixes the image
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token is not left in the checkout
          persist-credentials: false

      - name: Build
        working-directory: firmware
        run: |
          # The checkout belongs to another user than the container; IDF reads the version via git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin -o speaker_buddy-merged.bin

      - name: Dependencies unchanged
        # The build must not have re-resolved the managed components
        working-directory: firmware
        run: git diff --exit-code -- dependencies.lock

      - name: Check image (A-04)
        run: |
          . "$IDF_PATH/export.sh"
          sh tools/check-image.sh firmware/build/speaker_buddy.elf

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          # The merged image flashes at 0x0; the parts and flash_args flash as idf.py prints it
          path: |
            firmware/build/speaker_buddy-merged.bin
            firmware/build/speaker_buddy.bin
            firmware/build/speaker_buddy.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
          if-no-files-found: error
