name: ci

on:
  push:
    branches: [main]
    paths:
      - "laptop/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "laptop/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  laptop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore laptop/SpeakerBuddy.sln

      - name: Build
        run: dotnet build laptop/SpeakerBuddy.sln --no-restore -warnaserror

      - name: Format
        run: dotnet format laptop/SpeakerBuddy.sln --no-restore --verify-no-changes

      - name: Test
        run: >
          dotnet test laptop/SpeakerBuddy.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory laptop/TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-laptop
          path: laptop/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Composite action (its only JavaScript step runs on node24). fail_ci_if_error stays false until
      # the CODECOV_TOKEN secret is set, so a missing token or a Codecov outage does not fail CI
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: laptop/TestResults
          flags: laptop
          fail_ci_if_error: false

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S firmware/test/host -B build-host

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware-build:
    runs-on: ubuntu-latest
    container:
      # ESP-IDF v5.5.5 as pinned in firmware/main/idf_component.yml; the digest fixes the image
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: firmware
        run: |
          # The checkout belongs to another user than the container; IDF reads the version via git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin -o speaker_buddy-merged.bin

      - name: Check image (A-04)
        run: |
          . "$IDF_PATH/export.sh"
          sh tools/check-image.sh firmware/build/speaker_buddy.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          # The merged image flashes at 0x0; the parts and flash_args flash as idf.py prints it
          path: |
            firmware/build/speaker_buddy-merged.bin
            firmware/build/speaker_buddy.bin
            firmware/build/speaker_buddy.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
          if-no-files-found: error
