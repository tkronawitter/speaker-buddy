name: release

# Builds both halves from a version tag and publishes them as a GitHub release. Push a tag such as
# v0.1.0 or v0.1.0-rc1; a tag with a hyphen becomes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Host tests
        run: |
          cmake -S firmware/test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    container:
      # Same pinned image as the ci workflow
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The firmware version is git describe, which needs the tags
          fetch-depth: 0

      - name: Build
        working-directory: firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin -o speaker_buddy-merged.bin

      - name: Dependencies unchanged
        # The build must not have re-resolved the managed components
        working-directory: firmware
        run: git diff --exit-code -- dependencies.lock

      - name: Check image (A-04)
        run: |
          . "$IDF_PATH/export.sh"
          sh tools/check-image.sh firmware/build/speaker_buddy.elf

      - name: Collect
        run: |
          mkdir -p dist
          cp firmware/build/speaker_buddy-merged.bin firmware/build/speaker_buddy.bin \
             firmware/build/bootloader/bootloader.bin firmware/build/partition_table/partition-table.bin dist/
          # Release assets have no folders, so flash_args names the parts without their build paths
          sed -e 's#bootloader/##' -e 's#partition_table/##' firmware/build/flash_args > dist/flash_args

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  laptop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The program version is git describe, which needs the tags
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test laptop/SpeakerBuddy.sln

      - name: Publish
        shell: pwsh
        run: ./tools/publish-laptop.ps1 -Output dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laptop
          path: dist/speaker-buddy.exe
          if-no-files-found: error

  release:
    needs: [firmware-host, firmware, laptop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release is created through gh with the job token; git never pushes
          persist-credentials: false

      # A folder of its own: the checkout above already has an assets/ folder (the logo), and a
      # download into it mixed repo files into the release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        # Regular files only, sorted, so a stray folder can never break or enter the list
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 -r sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: sed "s/@TAG@/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag $prerelease \
            --title "Speaker Buddy $GITHUB_REF_NAME" \
            --notes-file notes.md
